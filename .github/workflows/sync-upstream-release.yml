name: Sync upstream and publish release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream master and release tag
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add FORK_SYNC_TOKEN with Contents: Read and write and Actions: Read and write permissions"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SimoHypers/limusic.git
          git fetch upstream master --tags
          git checkout master
          # Keep fork-specific workflow and updater settings where upstream edits those same lines,
          # while taking every non-conflicting upstream change automatically.
          git merge -X ours --no-edit upstream/master
          git push origin master

          publish_release() {
            local tag="$1" prerelease="$2" notes assets version missing suffix
            git push origin "refs/tags/$tag:refs/tags/$tag"
            notes="$(mktemp)"
            gh api "repos/SimoHypers/limusic/releases/tags/$tag" --jq .body > "$notes"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [ "$prerelease" = true ]; then
                gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
                  --notes-file "$notes" --prerelease --latest=false
              else
                gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
                  --notes-file "$notes" --latest
              fi
            fi

            # Dispatch with the PAT: workflow_dispatch events from GITHUB_TOKEN are suppressed.
            # Retry all platform jobs whenever one of this release channel's assets is missing.
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join("\n")')"
            version="${tag#v}"
            missing=0
            if [ "$prerelease" = true ]; then
              for suffix in .AppImage .exe "_${version}_aarch64.dmg" "_${version}_x86_64.dmg"; do
                if ! printf '%s\n' "$assets" | grep -F "$suffix" >/dev/null; then missing=1; fi
              done
            else
              for suffix in .AppImage .deb .exe .msi "_${version}_aarch64.dmg" "_${version}_x86_64.dmg"; do
                if ! printf '%s\n' "$assets" | grep -F "$suffix" >/dev/null; then missing=1; fi
              done
            fi
            if [ "$missing" = 1 ]; then
              gh workflow run "Linux release binaries" --repo "$GITHUB_REPOSITORY" --ref master -f tag="$tag"
              gh workflow run "Windows release binaries" --repo "$GITHUB_REPOSITORY" --ref master -f tag="$tag"
              gh workflow run "macOS release binaries" --repo "$GITHUB_REPOSITORY" --ref master -f tag="$tag"
            else
              echo "All public installers already exist for $tag"
            fi
          }

          # Stable and beta channels advance independently. GitHub returns releases newest first.
          STABLE_TAG="$(gh api repos/SimoHypers/limusic/releases/latest --jq .tag_name)"
          BETA_TAG="$(gh api "repos/SimoHypers/limusic/releases?per_page=100" \
            --jq '[.[] | select(.prerelease == true and .draft == false)][0].tag_name // empty')"
          publish_release "$STABLE_TAG" false
          if [ -n "$BETA_TAG" ]; then
            publish_release "$BETA_TAG" true
          else
            echo "No published upstream prerelease to mirror"
          fi
