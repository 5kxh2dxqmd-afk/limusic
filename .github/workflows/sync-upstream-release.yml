name: Sync upstream and publish release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream master and release tag
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add FORK_SYNC_TOKEN with Contents: Read and write and Actions: Read and write permissions"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SimoHypers/limusic.git
          git fetch upstream master --tags
          git checkout master
          # Keep fork-specific workflow and updater settings where upstream edits those same lines,
          # while taking every non-conflicting upstream change automatically.
          git merge -X ours --no-edit upstream/master
          git push origin master

          # Mirror the source tag and publish the release in this public repository.
          TAG="$(gh api repos/SimoHypers/limusic/releases/latest --jq .tag_name)"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES_FILE="$(mktemp)"
          gh api "repos/SimoHypers/limusic/releases/tags/$TAG" --jq .body > "$NOTES_FILE"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file "$NOTES_FILE" --latest
          fi

          # Dispatch with the PAT: workflow_dispatch events from GITHUB_TOKEN are suppressed.
          # If any public installer is missing, rebuild the release assets and replace existing files.
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join("\n")')"
          VERSION="${TAG#v}"
          MISSING=0
          for suffix in .AppImage .deb .exe .msi "_${VERSION}_aarch64.dmg" "_${VERSION}_x86_64.dmg"; do
            if ! printf '%s\n' "$ASSETS" | grep -F "$suffix" >/dev/null; then
              MISSING=1
            fi
          done
          if [ "$MISSING" = 1 ]; then
            gh workflow run "Linux release binaries" --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
            gh workflow run "Windows release binaries" --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
            gh workflow run "macOS release binaries" --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"
          else
            echo "All public installers already exist for $TAG"
          fi
